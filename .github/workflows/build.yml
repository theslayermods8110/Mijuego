name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Crear proyecto si no existe
        run: |
          if (-Not (Test-Path "Mijuego.csproj")) {
            dotnet workload install maui-android
            dotnet new maui -n Mijuego -o . --force
          }
      - name: Guardar proyecto en el repo
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add -A
          git commit -m "Guardar proyecto" --allow-empty
          git push
      - name: Compilar APK
        run: dotnet publish -f net10.0-android -c Release -o ./apk
      - uses: actions/upload-artifact@v4
        with: { name: Mijuego-APK, path: ./apk/*.apk }
